name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Branch protection on master requires a status check named "verify"
  # (strict, admins included). This job is that check. It runs on every PR
  # and on every push to master; nothing deploys unless it passes.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail only on high/critical: every advisory so far has been a
      # dev-only toolchain package, and a low-severity one should not block
      # shipping a content fix. Re-check `npm audit` by hand periodically.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  build:
    # PRs are verified but never deployed.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional. Unset -> the map falls back to the keyless Esri basemap.
          # Add either as a repository secret to switch providers.
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_STADIA_API_KEY: ${{ secrets.VITE_STADIA_API_KEY }}
      # The custom domain belongs to this deployment, not to the source tree.
      # Anyone else building this repo gets a clean dist/ with no CNAME.
      - name: Write CNAME for the rs.rdmtoolkit.ca deployment
        run: echo "rs.rdmtoolkit.ca" > dist/CNAME
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
