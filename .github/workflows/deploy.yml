name: Verify release
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      containment:
        description: Build the official-links containment fallback
        type: boolean
        default: false
env:
  VITE_CONTAINMENT: ${{ inputs.containment && '1' || '' }}
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: node scripts/build-release-manifest.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-${{ github.sha }}
          include-hidden-files: true
          path: |
            dist/
            artifacts/release-manifest.json
            docs/launch-closure-record.md
            docs/operations-runbook.md
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: verification-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
# This workflow deliberately produces a candidate artifact. It does not publish.
# Choose a host supporting the supplied headers and authorize release separately.
