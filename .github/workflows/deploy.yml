name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: every job gets a read-only token by default. Only the
# deploy job, which never runs PR code, is granted the Pages + OIDC scopes it
# needs to publish. The verify job runs `npm ci` against whatever a PR
# contains, so it must not hold a token that can deploy the site.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Branch protection on master requires a status check named "verify"
  # (strict, admins included). This job is that check. It runs on every PR
  # and on every push to master; nothing deploys unless it passes.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail only on high/critical: every advisory so far has been a
      # dev-only toolchain package, and a low-severity one should not block
      # shipping a content fix. Re-check `npm audit` by hand periodically.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build:
    # PRs are verified but never deployed.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional. Unset -> the map falls back to the keyless Esri basemap.
          # Add either as a repository secret to switch providers.
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_STADIA_API_KEY: ${{ secrets.VITE_STADIA_API_KEY }}
      # The custom domain belongs to this deployment, not to the source tree.
      # Anyone else building this repo gets a clean dist/ with no CNAME.
      - name: Write CNAME for the rs.rdmtoolkit.ca deployment
        run: echo "rs.rdmtoolkit.ca" > dist/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
