<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Research Security Toolkit</title>
    <meta name="description" content="Free, plain-language tools for Canadian researchers and research administrators navigating federal research security policy — STRAC, NSGRP, Named Research Organizations, Sensitive Technology Research Areas, and export controls. No account required." />

    <!-- The SITE_URL placeholders below are filled in at build time from
         SITE_URL in src/siteConfig.js (or a SITE_URL environment variable)
         by the site-url plugin in vite.config.js. Do not hard-code a domain. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Research Security Toolkit" />
    <meta property="og:title" content="Research Security Toolkit" />
    <meta property="og:description" content="Free, plain-language tools for Canadian researchers navigating federal research security policy — STRAC, NSGRP, NROs, STRAs, and export controls." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Research Security Toolkit — Canadian research security, without the guesswork." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Research Security Toolkit" />
    <meta name="twitter:description" content="Free, plain-language tools for Canadian researchers navigating federal research security policy." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#061727" />

    <!-- CSP mostly works via a meta tag, so what remains here is enforced.
         Two things do NOT and are absent by design: X-Content-Type-Options
         (not a valid http-equiv pragma directive at all) and CSP's own
         frame-ancestors (ignored by the spec outside an HTTP header — it was
         logging a console error on every page load). Both must be set as real
         HTTP response headers; see the "Security headers" section of
         HANDOFF.md. Referrer policy is NOT in that group — it works via
         <meta name="referrer"> below, which is why it is still in the page.
         script-src has NO 'unsafe-inline': the production build emits a single
         external module script and no inline handlers, so the allowance was
         dead weight — and it is exactly what an injected onerror= attribute
         would need in order to run. Do not re-add it to silence a warning.
         img-src must list every basemap host in src/data/mapTiles.js; adding
         a tile provider without adding its host here silently breaks the map.
         Fonts are self-hosted (see src/main.jsx), so style-src and font-src
         are 'self' only — no Google Fonts. Keep this policy identical to the
         header version in HANDOFF.md §4. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://tiles.stadiamaps.com;
      connect-src 'self' https://nominatim.openstreetmap.org https://en.wikipedia.org;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'none';
    " />
    <!--
      Referrer policy MUST use name="referrer", not http-equiv -- "Referrer-Policy"
      is not one of the valid http-equiv pragma directives. See CLAUDE.md
      ("Security headers") before adding any security-related meta tag here.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
